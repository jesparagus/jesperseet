<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>jesper seet - creative portfolio</title>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
:root{--s:1.6;--bg:#fff;--ink:#111;--mute:#8a8a8a;--line:#e4e4e4;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--ink);font:300 calc(12px*var(--s))/1.6 "JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;overflow:hidden}
a{color:inherit;text-decoration:none}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
header{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;display:flex;justify-content:space-between;padding:calc(22px*var(--s)) calc(28px*var(--s));z-index:100;transform:translateZ(0)}
nav a{margin-left:calc(22px*var(--s));color:var(--mute)}
nav a:hover,nav a[aria-current="page"]{color:var(--ink)}
nav a[aria-current="page"]{text-decoration:underline;text-underline-offset:4px}
.page{display:none;position:absolute;inset:0}
.page.on{display:block}

/* curved gallery */
#stagePh{position:absolute;inset:0;perspective:calc(900px*var(--s));perspective-origin:50% 50%;overflow:hidden;touch-action:pan-y}
#ring{position:absolute;left:50%;top:50%;width:0;height:0;transform-style:preserve-3d}
.slot{position:absolute;left:0;top:0;transform-style:preserve-3d;backface-visibility:hidden}
.tile{position:absolute;display:block;padding:0;border:0;background:none;cursor:pointer;overflow:visible;
 transform:translateZ(0);transition:transform .45s cubic-bezier(.2,.7,.2,1)}
.tile:hover,.tile:focus-visible{transform:translateZ(calc(70px*var(--s))) scale(1.06)}
.tile img{display:block;width:100%;height:100%;object-fit:contain}
.tile .ph{display:block;width:100%;height:100%}
.tile .cap{position:absolute;left:0;top:calc(100% + 8px);white-space:nowrap;color:var(--ink);opacity:0;transition:opacity .3s}
.tile:hover .cap,.tile:focus-visible .cap{opacity:1}
.note{position:absolute;left:calc(28px*var(--s));bottom:calc(22px*var(--s) + env(safe-area-inset-bottom,0px));color:var(--mute)}

/* cinematography */
.cine.on{display:flex}
.cine{flex-direction:column;justify-content:flex-start;justify-content:safe center;align-items:center;gap:calc(36px*var(--s));padding:calc(90px*var(--s)) calc(28px*var(--s)) calc(60px*var(--s));overflow:auto}
.reel{position:relative;display:block;width:min(calc(900px*var(--s)),100%);aspect-ratio:16/9;background:#f4f4f4;border:1px solid var(--line);padding:0;color:inherit;cursor:pointer;font:inherit;text-align:left;overflow:hidden}
.reel .thumb{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;pointer-events:none}
.reel iframe{position:absolute;inset:0;display:block;width:100%;height:100%;border:0}
.reel .tri{position:absolute;left:50%;top:50%;width:0;height:0;border-left:16px solid var(--ink);border-top:10px solid transparent;border-bottom:10px solid transparent;transform:translate(-35%,-50%);transition:transform .3s}
.reel:hover .tri{transform:translate(-35%,-50%) scale(1.25)}
.reel .lab{position:absolute;left:14px;bottom:10px}
.films{width:min(calc(900px*var(--s)),100%);border-top:1px solid var(--line);padding-top:16px}

/* lightbox */
#lb{position:fixed;inset:0;background:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:30;padding:60px 28px}
#lb.open{display:flex}
#lb .box{max-width:100%;max-height:78vh;width:min(70vw,900px);aspect-ratio:var(--r)}
#lb .box>*{width:100%;height:100%;object-fit:contain;display:block}
#lb button{position:absolute;background:none;border:0;font:inherit;color:var(--mute);cursor:pointer;padding:10px}
#lb button:hover{color:var(--ink)}
#lb .x{top:max(18px,env(safe-area-inset-top));right:22px}#lb .p{left:18px;top:50%}#lb .n{right:18px;top:50%}
@media (max-width:720px){:root{--s:1}header{padding:16px 18px}.note{left:18px}#lb .box{width:100%}}
</style>
</head>
<body>
<header>
  <a href="#photography">jesper seet</a>
  <nav><a href="#photography" data-p="photography">photography</a><a href="#cinematography" data-p="cinematography">cinematography</a></nav>
</header>

<main>
  <section class="page" id="photography" aria-label="Photography">
    <div id="stagePh"><div id="ring"></div></div>
    <div class="note">move the cursor to spin · click a photo to open</div>
  </section>

  <section class="page cine" id="cinematography" aria-label="Cinematography">
    <button class="reel" id="reelLink" type="button" aria-label="Play the reel">
      <img class="thumb" src="https://img.youtube.com/vi/bMZotERnYkQ/hqdefault.jpg" alt="" aria-hidden="true">
      <span class="tri" aria-hidden="true"></span><span class="lab">reel</span>
    </button>
    <div class="films"><span>all films</span></div>
  </section>
</main>

<div id="lb" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="x" aria-label="Close">close</button>
  <button class="p" aria-label="Previous photo">prev</button>
  <button class="n" aria-label="Next photo">next</button>
  <div class="box" id="box"></div><div id="cap"></div>
</div>

<script>
/* ===== EDIT THESE ===== */
var REEL_URL="https://youtu.be/bMZotERnYkQ";
var FILMS_URL="#";
var PHOTOS=[
 {t:"Camp",r:1.5,src:"Camp.jpg",thumb:"thumbnails/Camp (Thumb).jpg"},
 {t:"Chicken Sprint",r:1.5,src:"Chicken Sprint.jpg",thumb:"thumbnails/Chicken Sprint (Thumb).jpg"},
 {t:"Chicken Vendor",r:1.5,src:"Chicken Vendor.jpg",thumb:"thumbnails/Chicken Vendor (Thumb).jpg"},
 {t:"Fabric",r:1.5,src:"Fabric.jpg",thumb:"thumbnails/Fabric (Thumb).jpg"},
 {t:"Future Gaze",r:1.5,src:"Future Gaze.jpg",thumb:"thumbnails/Future Gaze (Thumb).jpg"},
 {t:"Girl Feeds Pigeons",r:1.5,src:"Girl Feeds Pigeons.jpg",thumb:"thumbnails/Girl Feeds Pigeons (Thumb).jpg"},
 {t:"Japan Crosswalk",r:1.5,src:"Japan Crosswalk.jpg",thumb:"thumbnails/Japan Crosswalk (Thumb).jpg"},
 {t:"Kian Heng Jade and Jewellery",r:1.5,src:"Kian Heng Jade and Jewellery.jpg",thumb:"thumbnails/Kian Heng Jade and Jewellery (Thumb).jpg"},
 {t:"Malaysian Farmers",r:1.5,src:"Malaysian Farmers.jpg",thumb:"thumbnails/Malaysian Farmers (Thumb).jpg"},
 {t:"Mantis",r:1.5,src:"Mantis.jpg",thumb:"thumbnails/Mantis (Thumb).jpg"},
 {t:"Mother and Son",r:1.5,src:"Mother and Son.jpg",thumb:"thumbnails/Mother and Son (Thumb).jpg"},
 {t:"National Youth Leadership Training Camp",r:1.5,src:"National Youth Leadership Training Camp.jpg",thumb:"thumbnails/National Youth Leadership Training Camp (Thumb).jpg"},
 {t:"Punk Rockin",r:1.5,src:"Punk Rockin.jpg",thumb:"thumbnails/Punk Rockin (Thumb).jpg"},
 {t:"Rest",r:1.5,src:"Rest.jpg",thumb:"thumbnails/Rest (Thumb).jpg"},
 {t:"Smoke Break",r:1.5,src:"Smoke Break.jpg",thumb:"thumbnails/Smoke Break (Thumb).jpg"},
 {t:"Street Vendor in Malaysia",r:1.5,src:"Street Vendor in Malaysia.jpg",thumb:"thumbnails/Street Vendor in Malaysia (Thumb).jpg"},
 {t:"Sunrise on the Colorado River",r:1.5,src:"Sunrise on the Colorado River.jpg",thumb:"thumbnails/Sunrise on the Colorado River (Thumb).jpg"},
 {t:"Sunset Hike",r:1.5,src:"Sunset Hike.jpg",thumb:"thumbnails/Sunset Hike (Thumb).jpg"},
 {t:"The Kids are Gonna Be Ok 1",r:1.5,src:"The Kids are Gonna Be Ok 1.jpg",thumb:"thumbnails/The Kids are Gonna Be Ok 1 (Thumb).jpg"},
 {t:"The Kids are Gonna Be Ok 2",r:1.5,src:"The Kids are Gonna Be Ok 2.jpg",thumb:"thumbnails/The Kids are Gonna Be Ok 2 (Thumb).jpg"},
 {t:"The Kids are Gonna Be Ok 3",r:1.5,src:"The Kids are Gonna Be Ok 3.jpg",thumb:"thumbnails/The Kids are Gonna Be Ok 3 (Thumb).jpg"},
 {t:"The Kids are Gonna Be Ok 4",r:1.5,src:"The Kids are Gonna Be Ok 4.jpg",thumb:"thumbnails/The Kids are Gonna Be Ok 4 (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled.jpg",thumb:"thumbnails/Untitled (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (2).jpg",thumb:"thumbnails/Untitled (2) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (3).jpg",thumb:"thumbnails/Untitled (3) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (4).jpg",thumb:"thumbnails/Untitled (4) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (5).jpg",thumb:"thumbnails/Untitled (5) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (6).jpg",thumb:"thumbnails/Untitled (6) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (7).jpg",thumb:"thumbnails/Untitled (7) (Thumb).jpg"},
 {t:"Untitled",r:1.5,src:"Untitled (8).jpg",thumb:"thumbnails/Untitled (8) (Thumb).jpg"}
];
/* ====================== */
var reelLink=document.getElementById("reelLink");
reelLink.addEventListener("click",function(){var f=document.createElement("iframe");f.src="https://www.youtube-nocookie.com/embed/bMZotERnYkQ?autoplay=1";f.title="Jesper's cinematography reel";f.allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";f.allowFullscreen=true;reelLink.replaceChildren(f)});
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;

function media(p,thumb,seed){
 var i=document.createElement("img");i.src=encodeURI(thumb||p.src);i.alt=p.t;i.loading=thumb?"lazy":"eager";i.decoding="async";
 i.onload=function(){var w=i.naturalWidth,h=i.naturalHeight;if(w&&h){p.r=w/h;if(thumb){size()}else if(typeof box!=="undefined"){lb.style.setProperty("--r",p.r);box.style.setProperty("--r",p.r)}}};
 return i;
}

function route(){var h=location.hash.slice(1)==="cinematography"?"cinematography":"photography";document.querySelectorAll(".page").forEach(function(s){s.classList.toggle("on",s.id===h)});document.querySelectorAll("nav a").forEach(function(a){a.toggleAttribute("aria-current",a.dataset.p===h);if(a.dataset.p===h)a.setAttribute("aria-current","page")});if(h!=="photography")closeLb()}addEventListener("hashchange",route);

var ring=document.getElementById("ring"),P=PHOTOS.length,N=36,slots=[],R=640,D=96,W=300,S=1.6;
function size(){var m=innerWidth<720;S=m?1:Math.max(1,Math.min(1.6,innerWidth/900));document.documentElement.style.setProperty("--s",S);R=(m?380:640)*S;D=R*.15;W=m?170:Math.min(320,innerWidth/S*.23)*S;slots.forEach(function(o){var w=o.p.r>=1?W:W*o.p.r,h=o.p.r>=1?W/o.p.r:W;o.b.style.cssText="width:"+w+"px;height:"+h+"px;left:"+(-w/2)+"px;top:"+(-h/2)+"px"})}
var GA=Math.PI*(3-Math.sqrt(5));
for(var i=0;i<N;i++)(function(i){var p=PHOTOS[i%P],lat=Math.asin((1-2*(i+.5)/N)*.88),lon=i*GA;var s=document.createElement("div");s.className="slot";var b=document.createElement("button");b.className="tile";b.type="button";b.setAttribute("aria-label","Open "+p.t);b.appendChild(media(p,p.thumb,i));var c=document.createElement("span");c.className="cap";c.textContent=p.t;b.appendChild(c);b.addEventListener("click",function(){openLb(i%P)});s.appendChild(b);ring.appendChild(s);slots.push({s:s,b:b,p:p,i:i,lat:lat,lon:lon,x:-Math.cos(lat)*Math.sin(lon),y:Math.sin(lat),z:-Math.cos(lat)*Math.cos(lon)})})(i);
size();addEventListener("resize",size);

var ry=0,rx=0,vx=0,vy=0,mx=.5,my=.5,active=false,t0=performance.now();var stage=document.getElementById("stagePh");stage.addEventListener("pointermove",function(e){var r=stage.getBoundingClientRect();mx=(e.clientX-r.left)/r.width;my=(e.clientY-r.top)/r.height;active=true});stage.addEventListener("pointerleave",function(){active=false});
function frame(now){var t=(now-t0)/1000;if(document.getElementById("photography").classList.contains("on")){var dx=Math.abs(mx-.5)<.06?0:mx-.5,dy=Math.abs(my-.5)<.06?0:my-.5;var tvx=reduce?0:(active?dx*.035:.0007),tvy=reduce?0:(active?-dy*.022:0);vx+=(tvx-vx)*.05;vy+=(tvy-vy)*.05;ry+=vx;rx=Math.max(-.9,Math.min(.9,rx+vy));ring.style.transform="translateZ("+D+"px) rotateX("+rx+"rad) rotateY("+ry+"rad)";var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx);slots.forEach(function(o){var z1=-o.x*sy+o.z*cy,z2=o.y*sx+z1*cx,zt=D+R*z2,op=Math.max(0,Math.min(1,(-zt-40*S)/(260*S))),fy=reduce?0:Math.sin(t*.7+o.i*1.9)*8*S;o.s.style.transform="rotateY("+o.lon+"rad) rotateX("+o.lat+"rad) translateZ("+(-R)+"px) translateY("+fy+"px)";o.s.style.opacity=op.toFixed(2);o.s.style.visibility=op>.02?"visible":"hidden";o.s.style.pointerEvents=op>.5?"auto":"none"})}requestAnimationFrame(frame)}requestAnimationFrame(frame);

var lb=document.getElementById("lb"),box=document.getElementById("box"),cap=document.getElementById("cap"),cur=0,last=null;
function show(i){cur=(i+P)%P;var p=PHOTOS[cur];lb.style.setProperty("--r",p.r);box.style.setProperty("--r",p.r);box.replaceChildren(media(p,false));cap.textContent=p.t}
function openLb(i){last=document.activeElement;show(i);lb.classList.add("open");lb.querySelector(".x").focus()}function closeLb(){if(!lb.classList.contains("open"))return;lb.classList.remove("open");if(last&&last.focus)last.focus()}
lb.querySelector(".x").onclick=closeLb;lb.querySelector(".p").onclick=function(){show(cur-1)};lb.querySelector(".n").onclick=function(){show(cur+1)};lb.addEventListener("click",function(e){if(e.target===lb)closeLb()});addEventListener("keydown",function(e){if(!lb.classList.contains("open"))return;if(e.key==="Escape")closeLb();if(e.key==="ArrowLeft")show(cur-1);if(e.key==="ArrowRight")show(cur+1)});route();
</script>
</body>
</html>
